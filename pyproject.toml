[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-from-scratch"
version = "1.0.0"
description = "Production-grade Intelligent Document Question Answering System built on FastAPI, ChromaDB, and Streamlit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Engineering Team" }
]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "fastapi",
    "chromadb",
    "sentence-transformers",
    "streamlit",
    "groq",
    "vector-database"
]
dependencies = [
    "fastapi==0.118.0",
    "uvicorn[standard]==0.37.0",
    "python-multipart==0.0.20",
    "pydantic==2.11.9",
    "pydantic-settings==2.11.0",
    "langchain-core==0.3.76",
    "langchain-text-splitters==0.3.11",
    "langchain-chroma==0.2.6",
    "langchain-huggingface==0.3.1",
    "langchain-groq==0.3.8",
    "chromadb==1.1.0",
    "sentence-transformers==5.1.1",
    "groq==0.32.0",
    "pymupdf==1.26.4",
    "python-docx==1.2.0",
    "streamlit==1.50.0",
    "requests==2.32.5",
    "python-dotenv==1.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-requests>=2.31.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
