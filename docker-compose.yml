services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["backend"]
    container_name: rag_backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-8001}:8001"
    env_file:
      - path: .env
        required: false
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8001
      - CORS_ORIGINS=*
    volumes:
      - rag_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - rag_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["frontend"]
    container_name: rag_frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8001
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rag_network

volumes:
  rag_data:
    driver: local

networks:
  rag_network:
    driver: bridge
